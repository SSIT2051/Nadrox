<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  
  <!-- Circuit pattern -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M40,120 L80,120 M80,100 L80,140"/>
    <path d="M176,120 L216,120 M176,100 L176,140"/>
    <circle cx="128" cy="128" r="32" fill="none"/>
    <path d="M128,96 L128,72 M128,160 L128,184"/>
    <path d="M104,128 L80,128 M152,128 L176,128"/>
  </g>
  
  <!-- Android robot silhouette -->
  <g transform="translate(128,110)" fill="url(#accent)">
    <!-- Head -->
    <path d="M-18,-30 Q18,-30 18,-10 L18,10 Q18,24 6,24 L-6,24 Q-18,24 -18,10 Z" filter="url(#glow)"/>
    <!-- Antennas -->
    <path d="M-14,-30 L-20,-42" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M14,-30 L20,-42" stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-7" cy="-18" r="2" fill="#1a1a2e"/>
    <circle cx="7" cy="-18" r="2" fill="#1a1a2e"/>
    <!-- Body -->
    <path d="M-22,10 L-22,35 Q-22,45 -12,45 L12,45 Q22,45 22,35 L22,10 Z" filter="url(#glow)"/>
    <!-- Arms -->
    <path d="M-22,15 L-35,25" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M22,15 L35,25" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Legs -->
    <path d="M-10,45 L-14,60" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M10,45 L14,60" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  
  <!-- "NADROX" text -->
  <text x="128" y="210" font-family="sans-serif" font-size="24" font-weight="bold" fill="url(#accent)" text-anchor="middle" letter-spacing="2">NADROX</text>
</svg>